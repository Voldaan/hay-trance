<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hay Trance - Tracklist & Event Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-6 font-sans">

  <!-- Header -->
  <header class="max-w-6xl mx-auto mb-8 text-center">
    <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 tracking-wider">
      HAY TRANCE
    </h1>
    <p class="text-gray-400 mt-2 text-lg">Playlist, live optredens in Nederland & achtergronden.</p>
  </header>

  <main class="max-w-6xl mx-auto space-y-12">
    
    <!-- SECTION 1: LIVE EVENT RADAR NEDERLAND -->
    <section class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
      <div class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
        <div>
          <h2 class="text-2xl font-bold text-cyan-400 flex items-center gap-2">
            <span>🇳🇱</span> Event Radar Nederland
          </h2>
          <p class="text-gray-400 text-sm mt-1">Aankomende optredens van artiesten uit onze playlist.</p>
        </div>
        <span id="events-status" class="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800/50 rounded-lg px-3 py-1.5 animate-pulse">
          Events zoeken...
        </span>
      </div>

      <!-- Events Grid -->
      <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-gray-500 text-sm col-span-full text-center py-4">Artiesten laden uit Spotify...</p>
      </div>
    </section>


    <!-- SECTION 2: TRACKLIST & ZOEKBALK -->
    <section>
      <!-- Zoek & Filter Bedieningspaneel -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center shadow-xl">
        <div class="relative w-full md:w-1/2">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Zoek op titel of artiest..." 
            class="w-full bg-gray-950 text-white border border-gray-800 rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-cyan-500 transition text-sm placeholder-gray-500"
          >
        </div>

        <div class="flex items-center justify-between w-full md:w-auto gap-4">
          <select 
            id="sort-select" 
            class="bg-gray-950 text-gray-300 border border-gray-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 cursor-pointer"
          >
            <option value="newest">Nieuwste eerst</option>
            <option value="oldest">Oudste eerst</option>
            <option value="title">Titel (A-Z)</option>
            <option value="artist">Artiest (A-Z)</option>
          </select>

          <span id="track-count" class="text-xs font-semibold bg-cyan-950 text-cyan-400 border border-cyan-800/50 rounded-lg px-3 py-2 whitespace-nowrap">
            0 platen
          </span>
        </div>
      </div>

      <!-- Status / Loading -->
      <div id="status" class="text-center text-cyan-400 text-lg my-12 animate-pulse font-medium">
        Playlist data ophalen bij Spotify...
      </div>

      <!-- Grid voor Trackcards -->
      <div id="track-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

      <!-- Geen resultaten melding -->
      <div id="no-results" class="hidden text-center text-gray-500 my-16">
        <p class="text-xl font-semibold">Geen nummers gevonden</p>
      </div>
    </section>

  </main>

  <script>
    // 1. CREDENTIALS (TOEGEVOEGD)
    const CLIENT_ID = '3c9a755f3b844dacb1b517067573ef02';
    const CLIENT_SECRET = '586f8801439842b09b9b5517d14f8da2';
    const PLAYLIST_ID = '31dSFy8AFEtptq8bWTFBDs';

    let allTracks = [];
    let uniqueArtistNames = new Set();

    // 2. Spotify Access Token
    async function getAccessToken() {
      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Authorization': 'Basic ' + btoa(CLIENT_ID + ':' + CLIENT_SECRET)
        },
        body: 'grant_type=client_credentials'
      });

      if (!response.ok) throw new Error('Spotify verbinding mislukt. Controleer ID/Secret.');
      const data = await response.json();
      return data.access_token;
    }

    // 3. Tracks Ophalen
    async function loadPlaylistTracks() {
      const statusDiv = document.getElementById('status');

      try {
        const token = await getAccessToken();
        const response = await fetch(`https://api.spotify.com/v1/playlists/${PLAYLIST_ID}/tracks?limit=100`, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        const data = await response.json();
        statusDiv.classList.add('hidden');

        allTracks = data.items
          .filter(item => item.track)
          .map(item => {
            // Unieke artiesten verzamelen voor event checks
            item.track.artists.forEach(a => uniqueArtistNames.add(a.name));

            return {
              id: item.track.id,
              title: item.track.name,
              artists: item.track.artists.map(a => a.name).join(', '),
              image: item.track.album.images[0]?.url || '',
              addedAt: new Date(item.added_at),
              spotifyUrl: item.track.external_urls.spotify
            };
          });

        filterAndRenderTracks();
        
        // Start het zoeken naar Nederlandse events voor de opgehaalde artiesten
        loadEventsForArtists();

      } catch (error) {
        statusDiv.innerText = error.message;
        statusDiv.className = 'text-red-400 text-center my-8 font-semibold';
      }
    }

    // 4. Live Events Ophalen via Bandsintown API
    async function loadEventsForArtists() {
      const eventsGrid = document.getElementById('events-grid');
      const eventsStatus = document.getElementById('events-status');
      const foundEvents = [];

      // Neem de eerste 15 unieke artiesten om overmatig API-verkeer te voorkomen
      const artistList = Array.from(uniqueArtistNames).slice(0, 15);

      for (const artist of artistList) {
        try {
          const res = await fetch(`https://rest.bandsintown.com/artists/${encodeURIComponent(artist)}/events?app_id=haytrance_app`);
          if (!res.ok) continue;

          const events = await res.json();
          if (Array.isArray(events)) {
            // Filter op evenementen in Nederland
            const nlEvents = events.filter(e => 
              e.venue && (e.venue.country === 'Netherlands' || e.venue.country === 'NL')
            );

            nlEvents.forEach(e => {
              foundEvents.push({
                artist: artist,
                eventName: e.title || e.venue.name,
                venue: e.venue.name,
                city: e.venue.city,
                date: new Date(e.datetime),
                url: e.url
              });
            });
          }
        } catch (e) {
          // Negeer individuele API fouten
        }
      }

      // Sorteer events op datum (dichtstbijzijnde eerst)
      foundEvents.sort((a, b) => a.date - b.date);

      eventsStatus.classList.remove('animate-pulse');
      eventsStatus.innerText = `${foundEvents.length} optredens gevonden`;

      eventsGrid.innerHTML = '';
      if (foundEvents.length === 0) {
        eventsGrid.innerHTML = `
          <div class="col-span-full text-center py-6 text-gray-500 text-sm">
            Geen geplande optredens in Nederland gevonden voor de artiesten uit de lijst.
          </div>`;
        return;
      }

      foundEvents.forEach(ev => {
        const dateStr = ev.date.toLocaleDateString('nl-NL', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });

        const card = document.createElement('div');
        card.className = 'bg-gray-950/80 border border-gray-800 rounded-xl p-4 flex flex-col justify-between hover:border-cyan-500/50 transition';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2">
              <span class="font-bold text-cyan-300 text-sm">${ev.artist}</span>
              <span class="text-xs bg-cyan-950 text-cyan-400 font-semibold px-2 py-0.5 rounded border border-cyan-800/40">${dateStr}</span>
            </div>
            <h4 class="text-white font-medium text-sm mt-2 line-clamp-1">${ev.eventName}</h4>
            <p class="text-gray-400 text-xs mt-1">📍 ${ev.venue}, ${ev.city}</p>
          </div>
          <a href="${ev.url}" target="_blank" class="mt-4 text-center text-xs text-cyan-400 border border-cyan-800/50 hover:bg-cyan-950 py-1.5 rounded-lg transition font-medium">
            Tickets & Info ↗
          </a>
        `;
        eventsGrid.appendChild(card);
      });
    }

    // 5. Track Filter & Render
    function filterAndRenderTracks() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const sortBy = document.getElementById('sort-select').value;
      const grid = document.getElementById('track-grid');
      const countLabel = document.getElementById('track-count');
      const noResults = document.getElementById('no-results');

      let filtered = allTracks.filter(track => {
        return track.title.toLowerCase().includes(searchQuery) || 
               track.artists.toLowerCase().includes(searchQuery);
      });

      if (sortBy === 'newest') filtered.sort((a, b) => b.addedAt - a.addedAt);
      else if (sortBy === 'oldest') filtered.sort((a, b) => a.addedAt - b.addedAt);
      else if (sortBy === 'title') filtered.sort((a, b) => a.title.localeCompare(b.title));
      else if (sortBy === 'artist') filtered.sort((a, b) => a.artists.localeCompare(b.artists));

      countLabel.innerText = `${filtered.length} platen`;
      grid.innerHTML = '';

      if (filtered.length === 0) {
        noResults.classList.remove('hidden');
        return;
      } else {
        noResults.classList.add('hidden');
      }

      filtered.forEach(track => {
        const addedDateStr = track.addedAt.toLocaleDateString('nl-NL', {
          year: 'numeric', month: 'short', day: 'numeric'
        });

        const card = document.createElement('div');
        card.className = 'bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-lg hover:border-cyan-500/50 hover:scale-[1.02] transition-all duration-300 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="relative group">
              <img src="${track.image}" alt="${track.title}" class="w-full aspect-square object-cover">
              <a href="${track.spotifyUrl}" target="_blank" class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center font-bold text-cyan-300 gap-1 text-sm">
                Open in Spotify ↗
              </a>
            </div>
            <div class="p-4">
              <h3 class="font-bold text-white text-base truncate" title="${track.title}">${track.title}</h3>
              <p class="text-cyan-400 text-sm truncate mt-0.5" title="${track.artists}">${track.artists}</p>
            </div>
          </div>
          <div class="p-4 pt-0 border-t border-gray-800/50 mt-2 flex justify-between items-center text-xs text-gray-500">
            <span>Toegevoegd:</span>
            <span class="text-gray-300 font-medium">${addedDateStr}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Event Listeners
    document.getElementById('search-input').addEventListener('input', filterAndRenderTracks);
    document.getElementById('sort-select').addEventListener('change', filterAndRenderTracks);

    // Start de applicatie
    loadPlaylistTracks();
  </script>
</body>
</html>
