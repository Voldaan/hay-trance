name: Auto Update Trance Releases

on:
  schedule:
    # Elke vrijdag om 06:00 UTC (08:00 NL tijd)
    - cron: '0 6 * * 5'
  workflow_dispatch: # Maakt handmatig testen op GitHub mogelijk!

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v3

      - name: Python instellen
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Dependencies installeren
        run: pip install requests

      - name: Voer Python Script Uit
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python update_releases.py

      - name: Commit en Push updates naar GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update releases.json for Release Friday" && git push)
